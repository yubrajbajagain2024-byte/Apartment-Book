# Opens the dev server in Expo Go and logs in with the seeded test user.
appId: host.exp.Exponent
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- openLink: exp://127.0.0.1:8081
# Home opens on Posts; its top bar shows Reels | Buzz | Posts and the profile button.
- extendedWaitUntil:
    visible: "What's on your mind.*"
    timeout: 90000
- takeScreenshot: 01-home-signed-out
- tapOn: "Profile"
- tapOn: "Log in"
- tapOn: "you@txstate.edu"
- inputText: ${EMAIL}
- tapOn: "••••••••"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "Log in"
    index: 1
# Logging in can land on Home: open Profile again from the header avatar if needed.
- extendedWaitUntil:
    visible: "Log out|What's on your mind.*"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Log out"
    commands:
      - tapOn: "Profile"
- extendedWaitUntil:
    visible: "Log out"
    timeout: 30000
- takeScreenshot: 02-profile-signed-in

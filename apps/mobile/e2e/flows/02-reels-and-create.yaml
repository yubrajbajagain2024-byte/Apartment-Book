# Reels and the create menu, signed in (run 01-signed-in.yaml first so a session is stored).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: "Create"
    timeout: 120000
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
# SAFETY: these flows tap, vote and post. They must only ever run as a seeded test account (ui-sim-…),
# never as a real person who happens to be signed in on this simulator. Fails here otherwise.
# Signed in, the Profile tab is your profile ("Edit profile" under the numbers): your name at the top ("…, account options")
# opens the account sheet, titled with the signed-in email.
- tapOn: "Profile.*"
- extendedWaitUntil:
    visible: "Join UniBuzz|Edit profile"
    timeout: 30000
- runFlow:
    when:
      visible: "Edit profile"
    commands:
      - tapOn: ".*ccount options"
      - assertVisible: "ui-sim-.*@txstate.edu"
      - tapOn: "Cancel"
- assertVisible: "Edit profile"
- tapOn: "Home.*"
# Reels. The Home bar may have slid away with an earlier scroll (Instagram style): a scroll up brings it back.
- scrollUntilVisible:
    element: "Reels"
    direction: UP
    timeout: 15000
- tapOn: "Reels"
- extendedWaitUntil:
    visible: "Turn sound on|Turn sound off"
    timeout: 30000
- assertVisible: "Pause|Play"
- takeScreenshot: e2e/screenshots/13-reels
- tapOn: "Orbit"
- waitForAnimationToEnd
# Create menu
- tapOn: "Create"
- assertVisible: "Post"
- assertVisible: "Reel"
- assertVisible: "Buzz \\(anonymous\\)"
- assertVisible: "Snap"
- takeScreenshot: e2e/screenshots/14-create-menu
# Buzz's composer is a sheet on Home's Buzz page: Home moves there and it rises (after the guidelines gate, if needed).
- tapOn: "Buzz \\(anonymous\\)"
- extendedWaitUntil:
    visible: "I understand|You're anonymous.*"
    timeout: 30000
- runFlow:
    when:
      visible: "I understand"
    commands:
      - tapOn: "I understand"
- extendedWaitUntil:
    visible: "You're anonymous.*"
    timeout: 30000
- assertVisible: "Buzz it"
- takeScreenshot: e2e/screenshots/15-create-buzz
- tapOn: "Close"

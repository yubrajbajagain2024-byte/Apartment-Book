# A reel on For you and the create menu, signed in (run 01-signed-in.yaml first so a session is stored).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: "Create"
    timeout: 120000
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
# SAFETY: these flows tap, vote and post. They must only ever run as a seeded test account (ui-sim-…),
# never as a real person who happens to be signed in on this simulator. Fails here otherwise.
# Signed in, the Profile tab is your profile ("Edit profile" under the numbers): your name at the top ("…, account options")
# opens the account sheet, titled with the signed-in email.
- tapOn: "Profile.*"
- extendedWaitUntil:
    visible: "Join Apartment Book|Edit profile"
    timeout: 30000
- runFlow:
    when:
      visible: "Edit profile"
    commands:
      - tapOn: ".*ccount options"
      - assertVisible: "ui-sim-.*@txstate.edu"
      - tapOn: "Cancel"
- assertVisible: "Edit profile"
- tapOn: "Home.*"
# Reels has no tab of its own: the seeded reel sits in For you as a post with a video, with the feed's sound button.
- scrollUntilVisible:
    element: ".*Quick tour of my new place.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Unmute|Mute"
- takeScreenshot: e2e/screenshots/13-reels
# Create menu. The Home bar may have slid away with that scroll (Instagram style): a scroll up brings it back.
- scrollUntilVisible:
    element: "Create"
    direction: UP
    timeout: 15000
- tapOn: "Create"
- assertVisible: "Post"
- assertVisible: "Reel"
- assertVisible: "Buzz \\(anonymous\\)"
- takeScreenshot: e2e/screenshots/14-create-menu
- tapOn: "Buzz \\(anonymous\\)"
- extendedWaitUntil:
    visible: ".*anonymous.*"
    timeout: 30000
- takeScreenshot: e2e/screenshots/15-create-buzz

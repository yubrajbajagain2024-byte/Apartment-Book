# Signed-out tour: Home (Reels | Buzz | Posts), the other tabs, and the profile sign-in prompt behind the header avatar.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: "Continue|Posts"
    timeout: 120000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Create a post"
    timeout: 60000
# Expo Go's floating developer gear sits on top of the header avatar: drag it out of the way (not present in real builds).
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
- assertVisible: "Reels"
- assertVisible: "Buzz"
- assertVisible: "Posts"
- takeScreenshot: e2e/screenshots/01-home-posts
- tapOn: "Buzz"
- waitForAnimationToEnd
- assertVisible: "Search Buzz"
- assertVisible: "Post anonymously on Buzz"
- takeScreenshot: e2e/screenshots/01-home-buzz
- tapOn: "Reels"
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/01-home-reels
- tapOn: "Posts"
- extendedWaitUntil:
    visible: "Create a post"
    timeout: 30000
- tapOn: "Roommates.*"
- extendedWaitUntil:
    visible: "Search roommate posts"
    timeout: 30000
- takeScreenshot: e2e/screenshots/02-roommates
- tapOn: "Marketplace.*"
- extendedWaitUntil:
    visible: "Search mattresses.*"
    timeout: 30000
- takeScreenshot: e2e/screenshots/03-marketplace
- tapOn: "Messages.*"
- assertVisible: "Log in to see your messages"
- tapOn: "Apartments.*"
- extendedWaitUntil:
    visible: "Search apartments"
    timeout: 30000
- takeScreenshot: e2e/screenshots/04-apartments
- tapOn: "Profile"
- assertVisible: "Join Apartment Book"
- takeScreenshot: e2e/screenshots/05-profile-signed-out
- tapOn: "Create account"
- assertVisible: "Create your account"
- takeScreenshot: e2e/screenshots/06-signup

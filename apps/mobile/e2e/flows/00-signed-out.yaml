# Signed-out tour: Home (For you | Buzz | Posts | Reels: opens on For you, the pager swipes between them), Search and Messages
# (the two icons in the top-right corner of every tab, like TikTok: Search lists people to follow, Messages asks to log in),
# Housing (Apartments | Roommates: opens on Apartments, same pager), Marketplace, and the sign-in prompt on the Profile tab.
# The bottom bar is Home, Housing, Marketplace, Profile. Needs the seeded sample posts (node e2e/sim-seed.mjs).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: "Continue|Posts"
    timeout: 120000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Create"
    timeout: 60000
# Expo Go's floating developer gear sits in the top-right corner, over the Search and Messages icons: drag it out of the way
# (not present in real builds).
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
- assertVisible: "For you"
- assertVisible: "Buzz"
- assertVisible: "Posts"
- assertVisible: "Reels"
- takeScreenshot: e2e/screenshots/01-home-foryou
# The four pages sit side by side in a pager: a flick to the left slides from For you to Buzz. The flick starts on the
# seeded Buzz row (centred first), because a photo carousel keeps horizontal swipes for itself (04-posts-look relies on that).
- scrollUntilVisible:
    element: ".*Landlord wants to keep my whole deposit.*"
    direction: DOWN
    centerElement: true
- swipe:
    start: "85%,50%"
    end: "15%,50%"
    duration: 400
- waitForAnimationToEnd
- assertVisible: "Search Buzz"
- tapOn: "Posts"
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/01-home-posts
- tapOn: "Buzz"
- waitForAnimationToEnd
- assertVisible: "Search Buzz"
- assertVisible: "Post anonymously on Buzz"
- takeScreenshot: e2e/screenshots/01-home-buzz
- tapOn: "Reels"
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/01-home-reels
- tapOn: "Posts"
- extendedWaitUntil:
    visible: "Create"
    timeout: 30000
# Search: the magnifier in the top-right corner (on Home it sits in the floating top bar) opens the people search; signed out
# the list still shows people to follow. "Search" is the icon's exact label; the feed boxes are named after their placeholders
# ("Search apartments", "Search Buzz"...), so only the icon matches.
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Search people"
    timeout: 30000
- takeScreenshot: e2e/screenshots/07-search-people
# Maestro's `back` only works on Android: on iOS the left-edge swipe pops the screen. 45% is above the keyboard the box opens.
- swipe:
    start: "2%,45%"
    end: "90%,45%"
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Create"
    timeout: 30000
# Housing: the bottom tab opens on Apartments; the "Roommates" label above the pager slides to the other half and a
# flick to the right brings Apartments back. The floating "+" follows the visible half.
- tapOn: "Housing.*"
- extendedWaitUntil:
    visible: "Search apartments"
    timeout: 30000
- takeScreenshot: e2e/screenshots/04-apartments
- tapOn: "Roommates"
- extendedWaitUntil:
    visible: "Search roommate posts"
    timeout: 30000
- takeScreenshot: e2e/screenshots/02-roommates
# Flick on the chip row: lower down a card's photo carousel would keep the swipe for itself.
- swipe:
    start: "15%,25%"
    end: "85%,25%"
    duration: 400
- waitForAnimationToEnd
- assertVisible: "Search apartments"
- tapOn: "Marketplace.*"
- extendedWaitUntil:
    visible: "Search mattresses.*"
    timeout: 30000
- takeScreenshot: e2e/screenshots/03-marketplace
# Messages: the inbox icon next to the magnifier (here in the Marketplace header) opens the chat list, a stack screen that
# asks to log in when signed out; the edge swipe returns to the tab.
- tapOn: "Messages"
- assertVisible: "Log in to see your messages"
- swipe:
    start: "2%,45%"
    end: "90%,45%"
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Search mattresses.*"
    timeout: 30000
# Profile is the fourth bottom tab (the header avatar is gone); signed out it shows the sign-in prompt.
- tapOn: "Profile.*"
- assertVisible: "Join Apartment Book"
- takeScreenshot: e2e/screenshots/05-profile-signed-out
- tapOn: "Create account"
- assertVisible: "Create your account"
- takeScreenshot: e2e/screenshots/06-signup

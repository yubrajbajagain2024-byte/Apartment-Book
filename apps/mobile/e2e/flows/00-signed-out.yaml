# Signed-out tour: Home (For you | Buzz | Reels beside your photo, the Campus | Global toggle under them for anyone with a university: opens on For you, the pager swipes between them), Search (the second bottom
# tab: it lists people to follow), the Notifications bell in Home's top-right corner (signed out it asks to log in), Messages (bottom tab: asks to log in),
# Explore (Room | Roommate | Marketplace: opens on Room, same pager), and the sign-in prompt on the Profile tab.
# The bottom bar is Home, Explore, Messages, Profile. Needs the seeded sample posts (node e2e/sim-seed.mjs).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: "Continue|Buzz"
    timeout: 120000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Create"
    timeout: 60000
# Expo Go's floating developer gear sits in the top-right corner, over the Notifications bell: drag it out of the way
# (not present in real builds).
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
- assertVisible: "For you"
- assertVisible: "Buzz"
- assertVisible: "Reels"
# Posts is a section without a tab: For you carries its posts.
- assertNotVisible: "Posts"
- takeScreenshot: e2e/screenshots/01-home-foryou
# The top bar has two rows like X's: your photo in a gradient ring ("Your profile") opens your profile, the CampConnect
# wordmark in the middle, the bell on the right; then the three labels, and under them the Campus | Global toggle for
# anyone with a university. The "+" badge on the photo ("Create") opens the create sheet. Signed out there is no campus
# to pick, so the toggle is not drawn.
- assertNotVisible: "Campus"
- assertNotVisible: "Global"
- takeScreenshot: e2e/screenshots/01-home-bar
# For you holds posts and reels only: the seeded Buzz thread is not on this page (it waits on the Buzz page).
- assertNotVisible: ".*Landlord wants to keep my whole deposit.*"
# The three pages sit side by side in a pager: a flick to the left slides from For you to Buzz. The flick starts on the
# seeded post's caption (centred first), because a photo carousel keeps horizontal swipes for itself (04-posts-look relies on that).
- scrollUntilVisible:
    element: ".*First week back on campus.*"
    direction: DOWN
    centerElement: true
- swipe:
    start: "85%,50%"
    end: "15%,50%"
    duration: 400
- waitForAnimationToEnd
- assertVisible: "Search Buzz"
- assertVisible: "Post anonymously on Buzz"
- takeScreenshot: e2e/screenshots/01-home-buzz
- tapOn: "Reels"
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/01-home-reels
# A tap on the label brings For you back.
- tapOn: "For you"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Create"
    timeout: 30000
# Notifications: the bell in the top-right corner of Home's floating top bar opens the notifications screen; signed out it
# asks to log in. "Notifications" is the bell's exact label (signed in it reads "Notifications, N unread").
- tapOn: "Notifications"
- extendedWaitUntil:
    visible: "Log in to see your notifications"
    timeout: 30000
- takeScreenshot: e2e/screenshots/08-notifications-signed-out
# Maestro's `back` only works on Android: on iOS the left-edge swipe pops the screen.
- swipe:
    start: "2%,45%"
    end: "90%,45%"
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Create"
    timeout: 30000
# Search: the second bottom tab is the people search under a "Search" title; signed out the list still shows people to
# follow. The box waits for a tap, so no keyboard is up.
- tapOn: "Search.*"
- extendedWaitUntil:
    visible: "Search people"
    timeout: 30000
- takeScreenshot: e2e/screenshots/07-search-people
# Explore (housing.tsx): its own top bar ("Find", then Room | Roommate | Marketplace, then the search box of the page on
# screen, named "Search apartments", "Search roommate posts" or "Search marketplace", then the pills). The bottom tab opens on Room (apartments); the "Roommate" label above the
# pager slides to the other half and a flick to the right brings Room back. The floating "+" follows the visible half.
- tapOn: "Explore.*"
- extendedWaitUntil:
    visible: "Find"
    timeout: 30000
- takeScreenshot: e2e/screenshots/04-apartments
- tapOn: "Roommate"
- extendedWaitUntil:
    visible: "Looking for a room"
    timeout: 30000
- takeScreenshot: e2e/screenshots/02-roommates
# Flick on the pills row: lower down a card's photo carousel would keep the swipe for itself.
- swipe:
    start: "15%,25%"
    end: "85%,25%"
    duration: 400
- waitForAnimationToEnd
- assertVisible: "Find"
- tapOn: "Marketplace"
# The Marketplace is the third page of Explore: the label above the pager slides to it, its category pills in the pills row.
- extendedWaitUntil:
    visible: "Mattress & bedding"
    timeout: 30000
- takeScreenshot: e2e/screenshots/03-marketplace
# Messages: the third bottom tab (after Explore); signed out it asks to log in.
- tapOn: "Messages.*"
- assertVisible: "Log in to see your messages"
# Profile is the fourth bottom tab; signed out it shows the sign-in prompt.
- tapOn: "Profile.*"
- assertVisible: "Join CampConnect"
- takeScreenshot: e2e/screenshots/05-profile-signed-out
- tapOn: "Create account"
- assertVisible: "Create your account"
- takeScreenshot: e2e/screenshots/06-signup

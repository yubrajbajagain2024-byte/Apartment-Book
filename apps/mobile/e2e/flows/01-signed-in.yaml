# Signed-in tour: your own profile first (Edit profile, Share profile, the classes card; add CS 1428 under Classes and remove it again; Saved says only you can see it), then the new Home: like a post, comment on it (heart, reply, delete from the hold menu), share it with Leo (a friend: the seed has him and this account follow each other) and find it as a card in your chat with him, vote and reply anonymously in Buzz, watch a reel, reach the profile, see Leo's post alone under Following (the feed menu next to the wordmark), follow Maya (her profile shows the classes the seed lists for her) and see hers join it, unfollow.
# Needs test data: SUPABASE_ACCESS_TOKEN=... node e2e/sim-seed.mjs   (then pass EMAIL and PASSWORD from its output)
appId: host.exp.Exponent
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- extendedWaitUntil:
    visible: "Create"
    timeout: 120000
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
# Log in through the Profile tab in the bottom bar (skipped when a session is already stored). Signed in, the tab is your own
# profile, with "Edit profile" under the numbers.
- tapOn: "Profile.*"
- extendedWaitUntil:
    visible: "Join Apartment Book|Edit profile"
    timeout: 30000
- runFlow:
    when:
      visible: "Join Apartment Book"
    commands:
      - tapOn: "Log in"
      - tapOn: "you@txstate.edu"
      - inputText: ${EMAIL}
      - tapOn: "••••••••"
      - inputText: ${PASSWORD}
      - tapOn:
          text: "Log in"
          index: 1
# SAFETY: never act as a real person who happens to be signed in on this simulator. Signed in, the Profile tab is your
# profile ("Edit profile"): your name at the top ("…, account options") opens the account sheet, titled with the signed-in email.
- extendedWaitUntil:
    visible: "Edit profile|Not Now"
    timeout: 30000
# iOS may offer to save the password after a login: dismiss it before opening the sheet.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 30000
- tapOn: ".*ccount options"
- assertVisible: "ui-sim-.*@txstate.edu"
- tapOn: "Cancel"
# Your own profile, TikTok style: Edit profile and Share profile under Following | Followers | Likes, the "Classes this
# semester" card ("Add your classes" while none are listed for this term), then the tabs Posts | Classes | Reels | Saved | Liked.
- assertVisible: "Edit profile"
- assertVisible: "Share profile"
- assertVisible: "Classes this semester.*|Add your classes"
# Classes: "Add class" opens the form with this semester picked; type a code, Add, and the class is listed with its remove
# button. Remove it again so the flow can run again and again (one left by a run that stopped halfway goes first). The code
# box is found by its placeholder, because "Class code" also names the label above it. A tap on the form's title puts the
# keyboard away, so Add is never under it. The Add class and Add buttons show an icon, which can come first in their
# accessibility names: hence the leading ".*".
- tapOn: "Classes"
- extendedWaitUntil:
    visible: ".*Add class"
    timeout: 15000
- runFlow:
    when:
      visible: "Remove CS 1428"
    commands:
      - tapOn: "Remove CS 1428"
      - extendedWaitUntil:
          notVisible: "Remove CS 1428"
          timeout: 15000
- tapOn: ".*Add class"
- tapOn: "CS 3358"
- inputText: "CS 1428"
- tapOn: "Add a class"
- tapOn: ".*Add"
- extendedWaitUntil:
    visible: "Remove CS 1428"
    timeout: 30000
- assertVisible: "CS 1428"
- tapOn: "Remove CS 1428"
- extendedWaitUntil:
    notVisible: "Remove CS 1428"
    timeout: 15000
# Saved is only yours until you change it (the default), and the line at the top of the tab says so.
- tapOn: "Saved"
- extendedWaitUntil:
    visible: "Only you can see your saved posts"
    timeout: 15000
- takeScreenshot: e2e/screenshots/21-profile
# Back to the top of the profile and its Posts tab, the way the other flows find it ("Edit profile" in view).
- scrollUntilVisible:
    element: "Edit profile"
    direction: UP
- tapOn: "Posts"
- tapOn: "Home.*"
- extendedWaitUntil:
    visible: "Create|Not Now"
    timeout: 60000
# iOS offers to save the password after a login: dismiss it.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
# Home opens on For you; the Posts checks below need the Posts page itself.
- tapOn: "Posts"
- waitForAnimationToEnd
# Posts (Instagram style): the newest post is a three-photo post liked by two other people.
- extendedWaitUntil:
    visible: "Post: Move-in day at the new place.*"
    timeout: 30000
- assertVisible: "Liked by UI Maya.*"
- assertVisible: "1 of 3"
- assertVisible: "Save"
- takeScreenshot: e2e/screenshots/10-posts-instagram
# A like from an earlier run persists: unlike first, so the flow can be run again and again.
- runFlow:
    when:
      visible: "Unlike"
    commands:
      - tapOn:
          text: "Unlike"
          index: 0
      - extendedWaitUntil:
          visible: "Like"
          timeout: 15000
- tapOn:
    text: "Like"
    index: 0
- extendedWaitUntil:
    visible: "Unlike"
    timeout: 15000
# The comment icon opens a sheet over the feed, like Instagram. Inside, the thread looks like TikTok's: the count up top
# ("No comments yet" on this post), the composer pinned at the bottom.
- tapOn:
    text: "Comment"
    index: 0
- extendedWaitUntil:
    visible: "No comments yet"
    timeout: 15000
- takeScreenshot: e2e/screenshots/10b-posts-comments-sheet
# Comment threads: write a comment, heart it (the count next to the heart reads "1 like") and tap the heart again to clear it,
# answer it from "Reply" (the chip reads "Replying to UI Sim"; the header counts the reply too: "2 comments"), then delete both
# so the flow can run again and again. Maestro reads text as a regex, hence the escaped parentheses and question mark.
# A comment is deleted from its hold menu: long-press its text, "Delete", then "Delete" again in the "Delete this comment?"
# alert. The reply goes first: deleting the parent would take it along.
- tapOn: "Write a comment"
- inputText: "Looks great (sim)"
- tapOn: "Post comment"
- extendedWaitUntil:
    visible: ".*Looks great \\(sim\\).*"
    timeout: 30000
- tapOn: "Like comment"
- extendedWaitUntil:
    visible: "1 like"
    timeout: 15000
- tapOn: "Like comment"
- extendedWaitUntil:
    notVisible: "1 like"
    timeout: 15000
- tapOn: "Reply"
- assertVisible: "Replying to.*"
- tapOn: "Write a comment"
- inputText: "Thanks!"
- tapOn: "Post comment"
- extendedWaitUntil:
    visible: ".*Thanks!.*"
    timeout: 30000
- assertVisible: "2 comments"
- takeScreenshot: e2e/screenshots/17-comment-thread
- longPressOn: ".*Thanks!.*"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Delete this comment\\?"
    timeout: 15000
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: ".*Thanks!.*"
    timeout: 15000
- longPressOn: ".*Looks great \\(sim\\).*"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Delete this comment\\?"
    timeout: 15000
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: ".*Looks great \\(sim\\).*"
    timeout: 15000
- extendedWaitUntil:
    visible: "No comments yet"
    timeout: 15000
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Write a comment"
    timeout: 15000
# Share, like Instagram: the paper plane under the top post (Leo's three-photo post) opens a sheet of your friends, the people
# you follow who follow you back ("Search friends" on top, "Share to…", the system share sheet, at the bottom). Pick Leo
# ("below" the search box keeps the tap inside the sheet, away from his name on the post behind it): his face reads selected
# and the composer appears ("To UI Leo", "Write a message", Send). After "Sending…" and a short "Sent" the sheet closes itself.
- tapOn:
    text: "Share"
    index: 0
- extendedWaitUntil:
    visible: "Search friends"
    timeout: 15000
- assertVisible: "Share to…"
- extendedWaitUntil:
    visible:
      text: "UI Leo"
      below: "Search friends"
    timeout: 30000
- tapOn:
    text: "UI Leo"
    below: "Search friends"
- assertVisible:
    text: "UI Leo"
    below: "Search friends"
    selected: true
- assertVisible: "To UI Leo"
- takeScreenshot: e2e/screenshots/20-share-sheet
- tapOn: "Write a message"
- inputText: "Look at this"
- tapOn: "Send"
- extendedWaitUntil:
    notVisible: "Search friends"
    timeout: 30000
# Leo has it in your chat with him (Messages, the third bottom tab): the post as a card, labelled "View post: …" (a tap
# opens the post), with the words as a bubble under it. The left-edge swipe pops the chat on iOS; Home is still on Posts.
- tapOn: "Messages.*"
- extendedWaitUntil:
    visible: "Chat with UI Leo"
    timeout: 30000
- tapOn: "Chat with UI Leo"
- extendedWaitUntil:
    visible: "View post.*"
    timeout: 30000
- assertVisible: "Look at this"
- takeScreenshot: e2e/screenshots/20-shared-post-chat
- swipe:
    start: "2%,45%"
    end: "90%,45%"
    duration: 400
- waitForAnimationToEnd
- tapOn: "Home.*"
- tapOn: "Posts"
- waitForAnimationToEnd
# Further down: a post with comments shows "View all 2 comments" and the newest one.
- scrollUntilVisible:
    element: "View all 2 comments"
    direction: DOWN
    centerElement: true
- assertVisible: ".*Saturday morning works for me.*"
- takeScreenshot: e2e/screenshots/10-posts-liked
# Buzz (Reddit-style rows): upvote in the feed, open the thread from the replies pill, reply anonymously from the
# "Join the conversation" bar (its label is "Reply anonymously"; tapping it opens the composer with the same label).
- tapOn: "Buzz"
- assertVisible: "Search Buzz"
- extendedWaitUntil:
    visible: ".*Landlord wants to keep my whole deposit.*"
    timeout: 30000
# Votes persist too: clear an upvote from an earlier run, then upvote.
- tapOn: "Upvote"
- takeScreenshot: e2e/screenshots/11-buzz-voted
- tapOn: ".*Open the thread"
- extendedWaitUntil:
    visible: "Reply anonymously.*"
    timeout: 30000
- tapOn: "Reply anonymously.*"
- inputText: "Take dated photos and send a demand letter. It worked for me."
- tapOn: "Send reply"
- extendedWaitUntil:
    visible: "Reply from Student [0-9]+, you"
    timeout: 30000
- assertVisible: "Upvote reply"
- assertVisible: "Post options"
- takeScreenshot: e2e/screenshots/12-buzz-thread
# Following, like Instagram. The thread is a stacked screen without the bottom tabs: Close brings Home back (the pager is
# still on Buzz). Following is a row of the menu that drops down from the CampConnect wordmark ("Choose feed"). Before Maya
# is followed it holds Leo's three-photo post (the seed has him and this account follow each other) and nothing of hers: the
# scroll would bring her words-only post into view if it were there, and notVisible waits because the campus list stays on
# screen until the Following one has loaded. Then, back on the campus, scroll to the top (Leo's three-photo post) and down to
# the first post whose header reads "UI Maya": tapping the name opens her profile. Follow her, look at the Following feed
# again, then unfollow again so the flow can run again and again.
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Home.*"
    timeout: 15000
- tapOn: "Posts"
- waitForAnimationToEnd
- tapOn: "Choose feed"
- tapOn: "Following"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "1 of 3"
    direction: UP
    timeout: 30000
- assertVisible: "Post: Move-in day at the new place.*"
- scroll
- extendedWaitUntil:
    notVisible: "Post: Does anyone know if the rec center.*"
    timeout: 15000
- assertNotVisible: "Post: First week back on campus.*"
- tapOn: "Choose feed"
- tapOn: "Texas State University"
- scrollUntilVisible:
    element: "1 of 3"
    direction: UP
- scrollUntilVisible:
    element: "UI Maya"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "UI Maya"
    index: 0
- extendedWaitUntil:
    visible: "Follow"
    timeout: 30000
# Her "Classes this semester" card lists this term's codes: the seed gives her CS 3358 and MATH 3398 and lets everyone see them.
- extendedWaitUntil:
    visible: "Classes this semester: .*CS 3358.*"
    timeout: 15000
- tapOn: "Follow"
- extendedWaitUntil:
    visible: "Following"
    timeout: 15000
- takeScreenshot: e2e/screenshots/16-profile-following
# The Following feed again, from the menu that drops down from the CampConnect wordmark (Instagram style; the Posts page has
# no chips of its own). Back on Home (the left-edge swipe pops the profile on iOS; the pager is still on Posts), "Choose feed"
# is the wordmark button and opens the menu: the seeded account's university, "All universities" and "Following". Following
# keeps Posts to the people you follow: now Maya's words-only post shows too, under Leo's three-photo post.
- swipe:
    start: "2%,45%"
    end: "90%,45%"
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Choose feed"
    timeout: 15000
- tapOn: "Choose feed"
- assertVisible: "All universities"
- takeScreenshot: e2e/screenshots/18-feed-menu
- tapOn: "Following"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Post: Does anyone know if the rec center.*"
    direction: UP
    timeout: 30000
- takeScreenshot: e2e/screenshots/19-posts-following
# Back to the whole campus (the row reads the profile's university, Texas State for every ui-sim account): the choice lives
# in memory for as long as the app runs, and the flows after this one expect the usual Posts page.
- tapOn: "Choose feed"
- tapOn: "Texas State University"
- scrollUntilVisible:
    element: "Post: Move-in day at the new place.*"
    direction: UP
    timeout: 30000
# Unfollow again so the flow can run again and again: Maya's name on her post opens her profile, where the button reads
# "Following" until it is tapped.
- scrollUntilVisible:
    element: "UI Maya"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "UI Maya"
    index: 0
- extendedWaitUntil:
    visible: "Following"
    timeout: 30000
- tapOn: "Following"
- extendedWaitUntil:
    visible: "Follow"
    timeout: 15000
- back

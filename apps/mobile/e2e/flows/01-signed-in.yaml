# Signed-in tour of the new Home: like a post, comment on it (heart, reply, delete from the hold menu), vote and reply anonymously in Buzz, watch a reel, reach the profile, follow Maya.
# Needs test data: SUPABASE_ACCESS_TOKEN=... node e2e/sim-seed.mjs   (then pass EMAIL and PASSWORD from its output)
appId: host.exp.Exponent
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- extendedWaitUntil:
    visible: "Create"
    timeout: 120000
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
# Log in through the Profile tab in the bottom bar (skipped when a session is already stored).
- tapOn: "Profile.*"
- extendedWaitUntil:
    visible: "Join Apartment Book|.*Log out"
    timeout: 30000
- runFlow:
    when:
      visible: "Join Apartment Book"
    commands:
      - tapOn: "Log in"
      - tapOn: "you@txstate.edu"
      - inputText: ${EMAIL}
      - tapOn: "••••••••"
      - inputText: ${PASSWORD}
      - tapOn:
          text: "Log in"
          index: 1
# SAFETY: never act as a real person who happens to be signed in on this simulator.
- runFlow:
    when:
      visible: ".*Log out"
    commands:
      - assertVisible: "ui-sim-.*@txstate.edu"
      - tapOn: "Home.*"
- extendedWaitUntil:
    visible: "Create|Not Now"
    timeout: 60000
# iOS offers to save the password after a login: dismiss it.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
# Home opens on For you; the Posts checks below need the Posts page itself.
- tapOn: "Posts"
- waitForAnimationToEnd
# Posts (Instagram style): the newest post is a three-photo post liked by two other people.
- extendedWaitUntil:
    visible: "Post: Move-in day at the new place.*"
    timeout: 30000
- assertVisible: "Liked by UI Maya.*"
- assertVisible: "1 of 3"
- assertVisible: "Save"
- takeScreenshot: e2e/screenshots/10-posts-instagram
# A like from an earlier run persists: unlike first, so the flow can be run again and again.
- runFlow:
    when:
      visible: "Unlike"
    commands:
      - tapOn:
          text: "Unlike"
          index: 0
      - extendedWaitUntil:
          visible: "Like"
          timeout: 15000
- tapOn:
    text: "Like"
    index: 0
- extendedWaitUntil:
    visible: "Unlike"
    timeout: 15000
# The comment icon opens a sheet over the feed, like Instagram. Inside, the thread looks like TikTok's: the count up top
# ("No comments yet" on this post), the composer pinned at the bottom.
- tapOn:
    text: "Comment"
    index: 0
- extendedWaitUntil:
    visible: "No comments yet"
    timeout: 15000
- takeScreenshot: e2e/screenshots/10b-posts-comments-sheet
# Comment threads: write a comment, heart it (the count next to the heart reads "1 like") and tap the heart again to clear it,
# answer it from "Reply" (the chip reads "Replying to UI Sim"; the header counts the reply too: "2 comments"), then delete both
# so the flow can run again and again. Maestro reads text as a regex, hence the escaped parentheses and question mark.
# A comment is deleted from its hold menu: long-press its text, "Delete", then "Delete" again in the "Delete this comment?"
# alert. The reply goes first: deleting the parent would take it along.
- tapOn: "Write a comment"
- inputText: "Looks great (sim)"
- tapOn: "Post comment"
- extendedWaitUntil:
    visible: ".*Looks great \\(sim\\).*"
    timeout: 30000
- tapOn: "Like comment"
- extendedWaitUntil:
    visible: "1 like"
    timeout: 15000
- tapOn: "Like comment"
- extendedWaitUntil:
    notVisible: "1 like"
    timeout: 15000
- tapOn: "Reply"
- assertVisible: "Replying to.*"
- tapOn: "Write a comment"
- inputText: "Thanks!"
- tapOn: "Post comment"
- extendedWaitUntil:
    visible: ".*Thanks!.*"
    timeout: 30000
- assertVisible: "2 comments"
- takeScreenshot: e2e/screenshots/17-comment-thread
- longPressOn: ".*Thanks!.*"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Delete this comment\\?"
    timeout: 15000
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: ".*Thanks!.*"
    timeout: 15000
- longPressOn: ".*Looks great \\(sim\\).*"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Delete this comment\\?"
    timeout: 15000
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: ".*Looks great \\(sim\\).*"
    timeout: 15000
- extendedWaitUntil:
    visible: "No comments yet"
    timeout: 15000
- tapOn: "Close"
# Further down: a post with comments shows "View all 2 comments" and the newest one.
- scrollUntilVisible:
    element: "View all 2 comments"
    direction: DOWN
    centerElement: true
- assertVisible: ".*Saturday morning works for me.*"
- takeScreenshot: e2e/screenshots/10-posts-liked
# Buzz (Reddit-style rows): upvote in the feed, open the thread from the replies pill, reply anonymously from the
# "Join the conversation" bar (its label is "Reply anonymously"; tapping it opens the composer with the same label).
- tapOn: "Buzz"
- assertVisible: "Search Buzz"
- extendedWaitUntil:
    visible: ".*Landlord wants to keep my whole deposit.*"
    timeout: 30000
# Votes persist too: clear an upvote from an earlier run, then upvote.
- tapOn: "Upvote"
- takeScreenshot: e2e/screenshots/11-buzz-voted
- tapOn: ".*Open the thread"
- extendedWaitUntil:
    visible: "Reply anonymously.*"
    timeout: 30000
- tapOn: "Reply anonymously.*"
- inputText: "Take dated photos and send a demand letter. It worked for me."
- tapOn: "Send reply"
- extendedWaitUntil:
    visible: "Reply from Student [0-9]+, you"
    timeout: 30000
- assertVisible: "Upvote reply"
- assertVisible: "Post options"
- takeScreenshot: e2e/screenshots/12-buzz-thread
# Following, like Instagram. The thread is a stacked screen without the bottom tabs: Close brings Home back (the pager is
# still on Buzz). On Posts, scroll to the top (Leo's three-photo post) and down to the first post whose header reads
# "UI Maya": tapping the name opens her profile. Follow her, then unfollow again so the flow can run again and again.
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Home.*"
    timeout: 15000
- tapOn: "Posts"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "1 of 3"
    direction: UP
- scrollUntilVisible:
    element: "UI Maya"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "UI Maya"
    index: 0
- extendedWaitUntil:
    visible: "Follow"
    timeout: 30000
- tapOn: "Follow"
- extendedWaitUntil:
    visible: "Following"
    timeout: 15000
- takeScreenshot: e2e/screenshots/16-profile-following
- tapOn: "Following"
- extendedWaitUntil:
    visible: "Follow"
    timeout: 15000
- back

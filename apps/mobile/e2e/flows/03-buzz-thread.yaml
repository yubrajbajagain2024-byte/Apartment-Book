# Buzz thread (UniVerse's layout): from Home's Buzz page open the seeded thread, vote on a reply, reply to a reply (it
# lands under its parent behind the rail, with the "replying to" chip in the reply bar first), then back to the feed.
# Needs: node e2e/sim-seed.mjs && node e2e/sim-seed-thread.mjs, and a stored session (run 01-signed-in.yaml first).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: "Create"
    timeout: 120000
- swipe:
    start: "88%,10%"
    end: "12%,62%"
    duration: 800
# SAFETY: these flows tap, vote and post. They must only ever run as a seeded test account (ui-sim-…),
# never as a real person who happens to be signed in on this simulator. Fails here otherwise.
# Signed in, the Profile tab is your profile ("Edit profile" under the numbers): your name at the top ("…, account options")
# opens the account sheet, titled with the signed-in email.
- tapOn: "Profile.*"
- extendedWaitUntil:
    visible: "Join UniBuzz|Edit profile"
    timeout: 30000
- runFlow:
    when:
      visible: "Edit profile"
    commands:
      - tapOn: ".*ccount options"
      - assertVisible: "ui-sim-.*@txstate.edu"
      - tapOn: "Cancel"
- assertVisible: "Edit profile"
- tapOn: "Home.*"
# Home's bar may have slid away with an earlier scroll (Instagram style): a scroll up brings it back.
- scrollUntilVisible:
    element: "Buzz"
    direction: UP
    timeout: 15000
- tapOn: "Buzz"
# The guidelines gate, inline, the first time only (01-signed-in.yaml normally accepted it already).
- extendedWaitUntil:
    visible: "I understand|Search .* buzz"
    timeout: 40000
- runFlow:
    when:
      visible: "I understand"
    commands:
      - tapOn: "I understand"
- extendedWaitUntil:
    visible: ".*Landlord wants to keep my whole deposit.*"
    timeout: 40000
# The card's words open the thread.
- tapOn: ".*Landlord wants to keep my whole deposit.*"
- extendedWaitUntil:
    visible: "Reply anonymously"
    timeout: 40000
- assertVisible: "Thread"
- assertVisible: "You're anonymous"
- takeScreenshot: e2e/screenshots/30-thread-top
# Vote on a reply (votes on your own replies are off: the first one open to you is someone else's).
- tapOn:
    text: "Upvote reply"
    index: 0
- takeScreenshot: e2e/screenshots/31-reply-voted
# Reply to a reply: the chip says who to, and × would go back to replying to the buzz.
- tapOn:
    text: "Reply to Anon .*"
    index: 0
- assertVisible: "Reply to the buzz instead"
- tapOn: "Reply anonymously"
- inputText: "Nested reply from the simulator"
- tapOn: "Send reply"
- extendedWaitUntil:
    visible: ".*Nested reply from the simulator.*"
    timeout: 30000
- takeScreenshot: e2e/screenshots/32-nested-reply
# Pull to refresh brings the server's order (and anything new), then Back to the feed.
- swipe:
    start: "50%,30%"
    end: "50%,80%"
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/33-refreshed
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Search .* buzz"
    timeout: 15000
